        <main id="content" role="main">
            <p class="instruction">Select Videos</p>
            <div class="grid-toggle">

                    <svg class="hi" width="16" height="16" aria-hidden="true" focusable="false"><use href="#hi-grid-2x2"/></svg>
                    2×2

                    <svg class="hi" width="16" height="16" aria-hidden="true" focusable="false"><use href="#hi-grid-3x3"/></svg>
                    3×3
                </button>
            </div>
            <div class="main-block container grid-2x2" id="video-grid">
                <div class="dropzone empty" id="video-1-1">
                    <span class="dropzone-icon empty-icon"><svg class="hi" width="24" height="24" aria-hidden="true" focusable="false"><use href="#hi-add-01"/></svg></span>

        <footer>
            <div class="footer-block container">
                <button type="button" class="button-secondary" id="advanced-settings-open">
                    <svg class="hi" width="16" height="16" aria-hidden="true" focusable="false"><use href="#hi-sliders-horizontal"/></svg>
                    Advanced
                </button>
                <button class="button" id="convert" type="submit">Convert</button>
            </div>
        </footer>
        <dialog id="advanced-settings" aria-labelledby="advanced-settings-title">
            <div class="dialog-header">
                <h2 id="advanced-settings-title">Advanced</h2>
                <button type="button" class="dialog-close" id="advanced-settings-close" aria-label="Close">
                    <svg class="hi" width="18" height="18" aria-hidden="true" focusable="false"><use href="#hi-cancel-01"/></svg>
                </button>
            </div>
            <div class="output-settings" role="group" aria-label="Output settings">
                <div class="output-field">
                    <span class="output-field-label">Resolution</span>
                    <select id="output-resolution">
                        <option value="1280x720" selected>1280×720</option>
                        <option value="1920x1080">1920×1080</option>
                    </select>
                </div>
                <div class="output-field">
                    <span class="output-field-label">Audio</span>
                    <select id="output-audio">
                        <option value="none" selected>Mute</option>
                        <option value="first">First clip</option>
                    </select>
                </div>
                <div class="output-field">
                    <span class="output-field-label">Fit</span>
                    <select id="output-fit">
                        <option value="letterbox" selected>Letterbox</option>
                        <option value="crop">Crop</option>
                    </select>
                </div>
                <div class="output-field">
                    <span class="output-field-label">Duration</span>
                    <select id="output-duration">
                        <option value="longest" selected>Full length</option>
                        <option value="5">5 seconds</option>
                        <option value="15">15 seconds</option>
                        <option value="30">30 seconds</option>
                        <option value="60">60 seconds</option>
                    </select>
                </div>
                <div class="output-field">
                    <span class="output-field-label">Pad</span>
                    <select id="output-pad">
                        <option value="black" selected>Black</option>
                        <option value="freeze">Freeze</option>
                    </select>
                </div>
            </div>
            <button type="button" class="button-secondary dialog-done" id="advanced-settings-done">Done</button>
        </dialog>
        <div id="overlay">
            <p class="instruction">Converting</p>
            <p id="progress-text">0%</p>
            <div class="loader-grid"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>
            <button type="button" id="cancel-convert">
                <svg class="hi" width="16" height="16" aria-hidden="true" focusable="false"><use href="#hi-cancel-01"/></svg>
                Cancel
            </button>
        </div>
        <div id="toast" role="status">Conversion complete</div>
        
        <script src="js/media-accept.js"></script>
        <script src="js/slot-fill.js"></script>
        <script src="js/cell-preview.js"></script>
        <script src="js/select.js"></script>
        <script src="js/index.js"></script>
