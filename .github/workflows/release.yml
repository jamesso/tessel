name: Build and Release

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test

  check-version:
    runs-on: ubuntu-latest
    outputs:
      version-changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    
    - name: Get current version
      id: get-version
      run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
    
    - name: Check if version needs release
      id: check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.get-version.outputs.version }}"
        if gh release view "v${VERSION}" >/dev/null 2>&1; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "Release v${VERSION} already exists"
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "No GitHub Release for v${VERSION} yet"
        fi

  build:
    needs: [test, check-version]
    if: (github.event_name == 'push' && needs.check-version.outputs.version-changed == 'true') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
            script: package-mac
            artifact-name: tessel-macos-arm64
            file-pattern: "release-builds/tessel-darwin-arm64/**/*"
          - os: ubuntu-latest
            platform: linux
            arch: x64
            script: package-linux
            artifact-name: tessel-linux-x64
            file-pattern: "release-builds/tessel-linux-x64/**/*"
          - os: windows-latest
            platform: win32
            arch: x64
            script: package-win
            artifact-name: tessel-windows-x64
            file-pattern: "release-builds/tessel-win32-x64/**/*"

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Ensure Electron binary
      run: node -e "const fs=require('fs'); const p=require('electron'); fs.accessSync(p); console.log(p)"

    - name: Build package
      run: npm run ${{ matrix.script }}

    - name: Rename and create archive (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        cd release-builds
        if [ "${{ matrix.platform }}" = "darwin" ]; then
          mv "Tessel-${{ matrix.platform }}-${{ matrix.arch }}" "tessel-macos-${{ matrix.arch }}"
          tar -czf tessel-macos-${{ matrix.arch }}.tar.gz tessel-macos-${{ matrix.arch }}
        else
          mv "Tessel-${{ matrix.platform }}-${{ matrix.arch }}" "tessel-${{ matrix.platform }}-${{ matrix.arch }}"
          tar -czf tessel-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz tessel-${{ matrix.platform }}-${{ matrix.arch }}
        fi

    - name: Rename and create archive (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        cd release-builds
        Rename-Item "Tessel-${{ matrix.platform }}-${{ matrix.arch }}" "tessel-windows-${{ matrix.arch }}"
        Compress-Archive -Path "tessel-windows-${{ matrix.arch }}" -DestinationPath "tessel-windows-${{ matrix.arch }}.zip"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact-name }}
        path: |
          release-builds/*.tar.gz
          release-builds/*.zip
        retention-days: 30

  release:
    needs: [check-version, build]
    if: github.event_name == 'push' && needs.check-version.outputs.version-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure of downloaded files
      run: ls -la artifacts/

    - name: Write release notes
      run: |
        cat > release-notes.md <<'EOF'
        ## Tessel v${{ needs.check-version.outputs.version }}
        
        ### Downloads
        - **macOS (ARM64)**: Download `tessel-macos-arm64.tar.gz` for Apple Silicon Macs
        - **Linux (x64)**: Download `tessel-linux-x64.tar.gz` for 64-bit Linux systems  
        - **Windows (x64)**: Download `tessel-windows-x64.zip` for 64-bit Windows systems
        
        ### Installation
        
        #### macOS Users - Important Security Notice
        Due to Apple's security requirements, you may see a "damaged app" warning when first opening Tessel. This is normal for apps not distributed through the App Store. To run Tessel safely:
        
        **Option 1 (Recommended):**
        1. Extract the downloaded archive
        2. **Right-click** on `Tessel.app` and select "Open" (don't double-click)
        3. Click "Open" when prompted about the unidentified developer
        
        **Option 2 (Terminal):**
        1. Extract the downloaded archive
        2. Open Terminal and run: `xattr -dr com.apple.quarantine /path/to/Tessel.app`
        3. Then double-click to open normally
        
        #### Other Platforms
        1. Download the appropriate package for your platform
        2. Extract the archive
        3. Run the Tessel executable
        
        ### Features
        - 2×2 and 3×3 mosaics with clip names and multi-file drop
        - 720p or 1080p, mute or first occupied cell’s audio (grid order), letterbox or crop
        - Duration: full length (pad shorter cells with black or freeze) or cap at 5, 15, 30, or 60 seconds from the start
        - Session restore: output settings, last save folder, and occupied cells on launch when files still exist
        - Rearrange clips: drag filled cell onto another to swap, or onto empty to copy
        - Cell previews: muted first-frame thumbnail; filenames stay visible
        - Cancel an in-progress convert; grid stays filled after success
        - MP4, MOV, M4V, WebM, AVI, and MKV inputs
        
        ### Changes
        See the commit history for detailed changes in this version.
        EOF

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v${{ needs.check-version.outputs.version }}" \
          artifacts/tessel-macos-arm64/tessel-macos-arm64.tar.gz \
          artifacts/tessel-linux-x64/tessel-linux-x64.tar.gz \
          artifacts/tessel-windows-x64/tessel-windows-x64.zip \
          --title "Tessel v${{ needs.check-version.outputs.version }}" \
          --notes-file release-notes.md
